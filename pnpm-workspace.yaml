# pnpm workspace manifest (migrated from npm workspaces, ).
# Mirrors the previous package.json "workspaces" globs.
#
# NOTE (pnpm 11): the package.json "pnpm" field is no longer read; all
# pnpm settings that are not npm-compatible (.npmrc) live here.
packages:
  - 'apps/*'
  - 'packages/*'

# Optional peers must be declared intentionally by the workspace. This keeps
# unused packagers such as electron-builder-squirrel-windows out of the install
# graph; Puntovivo ships Windows through electron-builder's NSIS target.
autoInstallPeers: false

# node-linker=hoisted: lay out a flat npm-style node_modules instead of pnpm's
# default symlinked/isolated store. The same value also lives in .npmrc (with
# the full rationale: Electron Forge and ensure-electron-binary.mjs assume a
# flat tree). It MUST be declared here
# too: pnpm 11 only honours .npmrc for the install layout, while `pnpm config
# get node-linker` resolves pnpm-workspace.yaml settings exclusively. Electron
# Forge's check-system runs `pnpm config get node-linker` (see
# @electron-forge/cli check-system.ts) and aborts `electron-forge start/make`
# with "node-linker must be set to hoisted" when it reads back undefined.
nodeLinker: hoisted

# Keep the dependency layout identical in local shells and CI. pnpm forces this
# experimental setting off under CI but otherwise leaves it unset; its
# verify-deps-before-run cache compares those two values literally and would
# launch an unnecessary install before every script after a CI-style install.
# Puntovivo already relies on the workspace-local hoisted virtual store.
enableGlobalVirtualStore: false

# Hoisted installs default to direct executable symlinks on POSIX. Some audited
# dependencies publish JavaScript bin targets without executable mode bits, so
# a restored or patched tree can turn those links into EACCES failures even
# though each file has a valid Node shebang. Generate portable command shims
# instead of depending on upstream tarball mode bits.
preferSymlinkedExecutables: false

# pnpm 11 blocks dependency lifecycle (install/postinstall) scripts by
# default as a supply-chain defence, and replaced the v10 list-style
# onlyBuiltDependencies with this allowBuilds map (pkg -> bool). Puntovivo
# genuinely needs the scripts below to produce a usable checkout:
# - argon2  -> installs its native hashing binding
# - esbuild -> fetches/links its platform binary (vite)
# better-sqlite3-multiple-ciphers v13 bundles Node-API binaries. pnpm still
# detects binding.gyp and proposes an implicit node-gyp build despite the
# package's gypfile=false contract, so deny it explicitly and use the bundled,
# integrity-checked binaries from the npm tarball.
# Electron 42+ no longer has an install/postinstall build script; its runtime is
# installed lazily by scripts/ensure-electron-binary.mjs before desktop use.
# Denied: core-js (postinstall only prints a funding banner).
allowBuilds:
  better-sqlite3-multiple-ciphers: false
  argon2: true
  esbuild: true
  core-js: false

# electron-builder uses app-builder-lib for every target, but its Squirrel
# package is only required for the Squirrel.Windows target. Puntovivo packages
# Windows as NSIS, so mark that target-specific peer optional instead of
# installing an unused vulnerable toolchain. The selector names no version on
# purpose: the peer is optional for every app-builder-lib release, and a pinned
# selector silently stops applying the moment electron-builder moves.
packageExtensions:
  'app-builder-lib':
    peerDependenciesMeta:
      electron-builder-squirrel-windows:
        optional: true
  # Sentry's Node bundle wires @sentry/opentelemetry at runtime but does not
  # declare its required @opentelemetry/core peer. Supply that exact sibling
  # version at the owning package boundary instead of leaving a peer warning.
  '@sentry/node@10.71.0':
    dependencies:
      '@opentelemetry/core': '2.10.0'

# Migrated from the npm "overrides" field (pnpm 11 reads overrides here, not in
# package.json). "exceljs>uuid" is the pnpm selector for the npm nested
# { exceljs: { uuid } } form.
overrides:
  # Every exact registry target below is registered with an owner, reason,
  # removal criteria, and bounded review date in
  # config/exact-overrides-policy.json. ci:shared fails when metadata is
  # missing, stale, duplicated, expired, or exceeds its category cadence.
  'exceljs>uuid': '11.1.1'
  'exceljs>archiver': '7.0.1'
  'exceljs>unzipper': '0.12.5'
  # Replace deprecated transitives instead of suppressing their install
  # warnings. Drizzle Kit already embeds and invokes tsx; the legacy loader is
  # an unused manifest dependency, aliased to the same tsx release the server
  # workspace resolves so the graph carries a single patched esbuild line. The
  # remaining aliases preserve the exact CommonJS call shapes consumed by their
  # owners.
  'drizzle-kit>@esbuild-kit/esm-loader': 'npm:tsx@4.23.12'
  boolean: 'file:packages/boolean-compat'
  'archiver-utils>glob': '14.0.3'
  lodash.isequal: 'npm:fast-deep-equal@3.1.3'
  '@electron/asar': '4.2.1'
  '@electron/packager': '20.0.4'
  '@electron/rebuild': '4.2.0'
  '@electron/universal': '3.0.6'
  # electron-builder 26 pins plist 3.1.0, whose xmldom line is now deprecated.
  # Align the packaging graph on plist 3.1.1 and its maintained parser patch.
  'app-builder-lib>plist': '3.1.1'
  'plist>@xmldom/xmldom': '0.9.12'
  filelist: '2.0.2'
  'readdir-glob@1.1.3>minimatch': '11.0.4'
  tar: '7.5.21'
  tmp: '0.2.7'
  # Security floors for transitive toolchain/runtime dependencies. Keep the
  # vulnerable-version selectors narrow so unrelated dependency lines can keep
  # following their owners' compatible ranges. glob <14.0.2 and minimatch
  # <11.0.1 have no patched release inside the ranges @electron/asar,
  # @sentry/bundler-plugins, readdir-glob and @eslint/config-array declare; the
  # majors keep the glob.sync / Minimatch / minimatch call shapes they use.
  'glob@13.0.6': '14.0.3'
  'minimatch@10.2.6': '11.0.4'
# Same-day releases stay exact and explicitly reviewed instead of relaxing the
# age policy globally. xmldom 0.9.12 is the published fix for the
# EntityReference serialization advisory and supersedes 0.9.11, which upstream
# marked vulnerable; its deprecation-floor review is bounded in
# config/exact-overrides-policy.json.
minimumReleaseAgeExclude:
  - '@xmldom/xmldom@0.9.12'

patchedDependencies:
  '@electron/asar@4.2.1': patches/@electron__asar@4.2.1.patch
